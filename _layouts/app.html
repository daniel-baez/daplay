<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ site.description | escape }}" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="{{ '/assets/css/daplay.css' | relative_url }}" />
  </head>
  <body>
    <div id="app"></div>
    <script>
      window.__DAPLAY__ = {
        route: {{ page.url | jsonify }},
        dataUrl: {{ '/assets/data/site.json' | relative_url | jsonify }}
      };
    </script>
    <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
  </body>
</html>
