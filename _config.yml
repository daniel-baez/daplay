title: daplay
email: your-email@example.com
description: >-
  Markdown in Jekyll. Interface in ClojureScript.
baseurl: ""
url: "https://daplay.cl"
github_username: daniel-baez

# Build settings — pages use the CLJS `app` layout; no theme UI.
plugins:
  - jekyll-feed

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: app
  - scope:
      path: ""
      type: pages
    values:
      layout: app

exclude:
  - node_modules
  - shadow-cljs.edn
  - package.json
  - package-lock.json
  - src
  - flake.nix
  - flake.lock
  - .envrc
  - .github
  - AGENTS.md
  - README.md
  - vendor
  - Gemfile
  - Gemfile.lock
