title: daplay
email: your-email@example.com
description: >-
  A personal blog and utility board — notes, plus curated link collections.
baseurl: ""
url: "https://daplay.cl"
github_username: daniel-baez
github_repo: daniel-baez/daplay
twitter_username: daplay
linkedin_username: baezdaniel
professional_url: "https://baezdaniel.cl"

# Build settings — pages use the CLJS `app` layout; no theme UI.
plugins:
  - jekyll-feed

collections:
  tiles:
    output: true
    permalink: /resources/:name/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: app
  - scope:
      path: ""
      type: pages
    values:
      layout: app
  - scope:
      path: ""
      type: tiles
    values:
      layout: app

exclude:
  - node_modules
  - shadow-cljs.edn
  - package.json
  - package-lock.json
  - src
  - flake.nix
  - flake.lock
  - .envrc
  - .github
  - AGENTS.md
  - README.md
  - vendor
  - Gemfile
  - Gemfile.lock
